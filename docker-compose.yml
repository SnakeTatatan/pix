services:

  # ── API (Hapi.js — le coeur) ───────────────────────────
  pix-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://pix:sTIa3KWZDFayP1UjbGaK@pix-pixdb-nymm1w:5432/pix
      - REDIS_URL=redis://pix-pixredis-TONHASH:6379
      - AUTH_SECRET=e9c4f8a2b7d1c3e5f6a8b9d0e2f4c6a7b8d1e3f5a7c9b0d2e4f6a8c1b3d5e7f9
      - LOG_LEVEL=info
      - PORT=3000
    networks:
      - pix-net
      - dokploy-network

  # ── mon-pix (élèves) ──────────────────────────────────
  mon-pix:
    build:
      context: .
      dockerfile: Dockerfile.monpix
      args:
        API_HOST: ${API_HOST}
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - pix-api
    networks:
      - pix-net

  # ── Orga (organisations) ──────────────────────────────
  pix-orga:
    build:
      context: .
      dockerfile: Dockerfile.orga
      args:
        API_HOST: ${API_HOST}
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - pix-api
    networks:
      - pix-net

  # ── Admin ─────────────────────────────────────────────
  pix-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        API_HOST: ${API_HOST}
    restart: unless-stopped
    ports:
      - "4202:80"
    depends_on:
      - pix-api
    networks:
      - pix-net

  # ── Certif ────────────────────────────────────────────
  pix-certif:
    build:
      context: .
      dockerfile: Dockerfile.certif
      args:
        API_HOST: ${API_HOST}
    restart: unless-stopped
    ports:
      - "4203:80"
    depends_on:
      - pix-api
    networks:
      - pix-net

networks:
  pix-net:
    driver: bridge
  dokploy-network:
    external: true
